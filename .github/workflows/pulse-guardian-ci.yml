name: Pulse Guardian ICU CI

on:
  push:
    paths:
      - "pulse-guardian-icu/**"
      - ".github/workflows/pulse-guardian-ci.yml"
  pull_request:
    paths:
      - "pulse-guardian-icu/**"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse-guardian-icu/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run risk engine + API tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse-guardian-icu/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pulse-guardian-icu/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: CI=true npm run build
